<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chatroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #e9eef3;
    --panel: #ffffff;
    --side: #10293f;
    --side-2: #1a3a56;
    --side-text: #c9d6e2;
    --ink: #17222d;
    --muted: #6b7b8a;
    --line: #d7dfe7;
    --accent: #f0a30a;
    --accent-ink: #3a2700;
    --mine: #10293f;
    --mine-text: #ffffff;
    --theirs: #ffffff;
    --error: #b3261e;
    --ok: #1f8a5b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c1823;
      --panel: #142433;
      --ink: #e6edf3;
      --muted: #8da0b2;
      --line: #263a4d;
      --mine: #f0a30a;
      --mine-text: #3a2700;
      --theirs: #1c3146;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 16px;
    line-height: 1.45;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* ---------- Auth screen ---------- */
  #auth { min-height: 100%; display: grid; place-items: center; padding: 20px; }
  .auth-card {
    width: min(100%, 400px);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 28px;
  }
  .brand { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 4px; }
  .tagline { color: var(--muted); margin: 0 0 20px; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--bg); border-radius: 10px; padding: 4px; margin-bottom: 18px; }
  .tabs button { border: 0; background: transparent; padding: 9px; border-radius: 8px; font-weight: 600; color: var(--muted); }
  .tabs button[aria-selected="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  label { display: block; font-weight: 600; font-size: 14px; margin: 12px 0 5px; }
  input[type=text], input[type=email], input[type=password] {
    width: 100%; padding: 11px 12px; border-radius: 9px;
    border: 1px solid var(--line); background: var(--panel);
  }
  .btn {
    border: 0; border-radius: 9px; padding: 11px 16px; font-weight: 700;
    background: var(--accent); color: var(--accent-ink);
  }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .btn.full { width: 100%; margin-top: 18px; }
  .msg { min-height: 22px; margin: 12px 0 0; font-size: 14px; }
  .msg.error { color: var(--error); }
  .msg.ok { color: var(--ok); }

  /* ---------- App layout ---------- */
  #app { height: 100%; display: grid; grid-template-columns: 300px 1fr; }
  aside { background: var(--side); color: var(--side-text); display: flex; flex-direction: column; min-height: 0; }
  .me { padding: 18px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--side-2); }
  .avatar {
    width: 38px; height: 38px; border-radius: 50%; flex: none;
    display: grid; place-items: center; font-weight: 700;
    background: var(--accent); color: var(--accent-ink);
  }
  .me strong { display: block; color: #fff; }
  .me small { opacity: .75; }
  .link-btn { margin-left: auto; background: transparent; border: 1px solid var(--side-2); color: var(--side-text); border-radius: 8px; padding: 6px 10px; font-size: 13px; }
  .link-btn:hover { background: var(--side-2); }
  .side-title { padding: 16px 18px 6px; font-weight: 700; color: #fff; }
  #roomList { list-style: none; margin: 0; padding: 0 10px; overflow-y: auto; flex: 1; }
  #roomList button {
    width: 100%; text-align: left; border: 0; background: transparent; color: inherit;
    padding: 10px 10px; border-radius: 9px; display: flex; justify-content: space-between; gap: 8px;
  }
  #roomList button:hover { background: var(--side-2); }
  #roomList button[aria-current="true"] { background: var(--side-2); color: #fff; box-shadow: inset 3px 0 0 var(--accent); }
  .count { font-size: 13px; opacity: .7; flex: none; }
  .empty-rooms { padding: 8px 10px; font-size: 14px; opacity: .8; }
  .new-room { padding: 14px; border-top: 1px solid var(--side-2); display: flex; gap: 8px; }
  .new-room input { background: var(--side-2); border-color: var(--side-2); color: #fff; }
  .new-room input::placeholder { color: #8fa4b8; }
  .new-room .btn { padding: 10px 14px; }

  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg); }
  .topbar { display: flex; align-items: center; gap: 12px; padding: 14px 20px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .topbar h2 { margin: 0; font-size: 19px; letter-spacing: -0.01em; }
  #menuBtn { display: none; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 10px; }
  .pill { margin-left: auto; font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .pill.live { color: var(--ok); border-color: var(--ok); }

  #messages { flex: 1; overflow-y: auto; padding: 18px 20px; display: flex; flex-direction: column; gap: 8px; }
  .older { align-self: center; background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-size: 14px; color: var(--muted); }
  .older:hover { color: var(--ink); }
  .placeholder { margin: auto; text-align: center; color: var(--muted); max-width: 320px; }
  .row { display: flex; flex-direction: column; max-width: min(72%, 560px); }
  .row.mine { align-self: flex-end; align-items: flex-end; }
  .who { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 4px 2px; }
  .bubble { padding: 9px 13px; border-radius: 14px; background: var(--theirs); border: 1px solid var(--line); overflow-wrap: anywhere; white-space: pre-wrap; }
  .row.mine .bubble { background: var(--mine); color: var(--mine-text); border-color: var(--mine); border-bottom-right-radius: 4px; }
  .row:not(.mine) .bubble { border-bottom-left-radius: 4px; }
  time { font-size: 12px; color: var(--muted); margin: 2px 4px 0; }

  form.composer { display: flex; gap: 10px; padding: 14px 20px; background: var(--panel); border-top: 1px solid var(--line); }
  form.composer input { flex: 1; }

  @media (max-width: 760px) {
    #app { grid-template-columns: 1fr; }
    aside { position: fixed; inset: 0 25% 0 0; z-index: 5; transform: translateX(-100%); transition: transform .2s; }
    body.menu-open aside { transform: none; }
    #menuBtn { display: block; }
    .row { max-width: 88%; }
  }
  @media (prefers-reduced-motion: reduce) { aside { transition: none; } }
</style>
</head>
<body>

<!-- ============ LOGIN / SIGNUP ============ -->
<section id="auth">
  <div class="auth-card">
    <h1 class="brand">Chatroom</h1>
    <p class="tagline">Pick a room and talk in real time.</p>

    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tabLogin" aria-selected="true">Log in</button>
      <button type="button" role="tab" id="tabSignup" aria-selected="false">Sign up</button>
    </div>

    <form id="authForm" novalidate>
      <div id="usernameWrap" hidden>
        <label for="username">Username</label>
        <input type="text" id="username" autocomplete="username" maxlength="50" />
      </div>
      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="email" />
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" />
      <button class="btn full" id="authSubmit" type="submit">Log in</button>
      <p class="msg" id="authMsg" role="status"></p>
    </form>
  </div>
</section>

<!-- ============ CHAT APP ============ -->
<div id="app" hidden>
  <aside id="sidebar">
    <div class="me">
      <div class="avatar" id="avatar">?</div>
      <div><strong id="meName"></strong><small id="meEmail"></small></div>
      <button class="link-btn" id="logoutBtn" type="button">Log out</button>
    </div>
    <div class="side-title">Rooms</div>
    <ul id="roomList"></ul>
    <form class="new-room" id="newRoomForm">
      <input type="text" id="newRoomName" placeholder="New room name" maxlength="100" aria-label="New room name" />
      <button class="btn" type="submit">Create</button>
    </form>
  </aside>

  <main>
    <div class="topbar">
      <button id="menuBtn" type="button" aria-label="Show rooms">Rooms</button>
      <h2 id="roomTitle">Choose a room</h2>
      <span class="pill" id="status">Offline</span>
    </div>
    <div id="messages" aria-live="polite">
      <p class="placeholder">Select a room on the left, or create one, to start chatting.</p>
    </div>
    <form class="composer" id="composer" autocomplete="off">
      <input type="text" id="msgInput" placeholder="Select a room first" aria-label="Message" disabled />
      <button class="btn" id="sendBtn" type="submit" disabled>Send</button>
    </form>
  </main>
</div>

<!-- Loads only if your server has Socket.io; the page still works without it -->
<script src="/socket.io/socket.io.js"></script>
<script>
// ====================================================
// 1. Small helpers and state
// ====================================================
const $ = (id) => document.getElementById(id);

const state = {
  token: localStorage.getItem("token"),
  user: JSON.parse(localStorage.getItem("user") || "null"),
  mode: "login",          // "login" or "signup"
  rooms: [],
  roomId: null,           // currently open room
  page: 1,                // history pages loaded so far
  socket: null,
  canSend: false,
};

// One function for every API call: adds the token, parses JSON, throws on errors
async function api(path, options = {}) {
  const headers = { "Content-Type": "application/json" };
  if (state.token) headers.Authorization = "Bearer " + state.token;

  const res = await fetch(path, { ...options, headers });
  let data = {};
  try { data = await res.json(); } catch { /* empty body */ }

  if (res.status === 401 && state.token) { logout(); throw new Error("Session expired. Log in again."); }
  if (!res.ok) throw new Error(data.error || "Request failed (" + res.status + ")");
  return data;
}

function say(el, text, kind) {
  el.textContent = text;
  el.className = "msg " + (kind || "");
}

// ====================================================
// 2. Login and signup
// ====================================================
function setMode(mode) {
  state.mode = mode;
  const signup = mode === "signup";
  $("tabLogin").setAttribute("aria-selected", String(!signup));
  $("tabSignup").setAttribute("aria-selected", String(signup));
  $("usernameWrap").hidden = !signup;
  $("authSubmit").textContent = signup ? "Create account" : "Log in";
  $("password").autocomplete = signup ? "new-password" : "current-password";
  say($("authMsg"), "");
}
$("tabLogin").onclick = () => setMode("login");
$("tabSignup").onclick = () => setMode("signup");

$("authForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = $("email").value.trim();
  const password = $("password").value;
  const username = $("username").value.trim();
  const msg = $("authMsg");

  if (!email || !password || (state.mode === "signup" && !username)) {
    return say(msg, "Fill in every field.", "error");
  }
  if (state.mode === "signup" && password.length < 6) {
    return say(msg, "Password needs at least 6 characters.", "error");
  }

  $("authSubmit").disabled = true;
  try {
    if (state.mode === "signup") {
      await api("/api/auth/signup", { method: "POST", body: JSON.stringify({ username, email, password }) });
      say(msg, "Account created. Logging you in...", "ok");
    }
    const data = await api("/api/auth/login", { method: "POST", body: JSON.stringify({ email, password }) });
    state.token = data.token;
    state.user = data.user;
    localStorage.setItem("token", data.token);
    localStorage.setItem("user", JSON.stringify(data.user));
    $("password").value = "";
    startApp();
  } catch (err) {
    say(msg, err.message, "error");
  } finally {
    $("authSubmit").disabled = false;
  }
});

function logout() {
  localStorage.removeItem("token");
  localStorage.removeItem("user");
  state.token = null; state.user = null; state.roomId = null;
  if (state.socket) { state.socket.disconnect(); state.socket = null; }
  $("app").hidden = true;
  $("auth").hidden = false;
  say($("authMsg"), "");
}
$("logoutBtn").onclick = logout;

// ====================================================
// 3. Start the app after login
// ====================================================
function startApp() {
  $("auth").hidden = true;
  $("app").hidden = false;
  $("meName").textContent = state.user.username;
  $("meEmail").textContent = state.user.email || "";
  $("avatar").textContent = state.user.username.charAt(0).toUpperCase();
  resetChatPane();
  connectSocket();
  loadRooms();
}

function resetChatPane() {
  state.roomId = null;
  $("roomTitle").textContent = "Choose a room";
  $("messages").replaceChildren(textEl("p", "placeholder", "Select a room on the left, or create one, to start chatting."));
  setComposer(false, "Select a room first");
}

function textEl(tag, cls, text) {
  const el = document.createElement(tag);
  if (cls) el.className = cls;
  el.textContent = text;       // textContent, never innerHTML: user text can't inject scripts
  return el;
}

// ====================================================
// 4. Rooms
// ====================================================
async function loadRooms() {
  try {
    state.rooms = await api("/api/rooms");
    renderRooms();
  } catch (err) {
    $("roomList").replaceChildren(textEl("li", "empty-rooms", err.message));
  }
}

function renderRooms() {
  const list = $("roomList");
  list.replaceChildren();
  if (!state.rooms.length) {
    list.append(textEl("li", "empty-rooms", "No rooms yet. Create the first one below."));
    return;
  }
  for (const room of state.rooms) {
    const li = document.createElement("li");
    const btn = document.createElement("button");
    btn.type = "button";
    if (room.id === state.roomId) btn.setAttribute("aria-current", "true");
    btn.append(textEl("span", "", "# " + room.name), textEl("span", "count", String(room.member_count)));
    btn.title = room.member_count + " member(s)";
    btn.onclick = () => openRoom(room);
    li.append(btn);
    list.append(li);
  }
}

$("newRoomForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const name = $("newRoomName").value.trim();
  if (!name) return;
  try {
    const room = await api("/api/rooms", { method: "POST", body: JSON.stringify({ name }) });
    $("newRoomName").value = "";
    await loadRooms();
    const fresh = state.rooms.find((r) => r.id === room.id);
    if (fresh) openRoom(fresh);
  } catch (err) {
    alert(err.message);
  }
});

async function openRoom(room) {
  document.body.classList.remove("menu-open");
  try {
    await api("/api/rooms/" + room.id + "/join", { method: "POST" });   // safe to repeat
  } catch (err) { return alert(err.message); }

  state.roomId = room.id;
  state.page = 1;
  $("roomTitle").textContent = "# " + room.name;
  $("messages").replaceChildren();
  renderRooms();
  loadRooms();   // refresh member counts in the background

  await loadHistory(true);
  if (state.socket && state.socket.connected) state.socket.emit("joinRoom", room.id);
  setComposer(state.canSend, state.canSend ? "Write a message" : "Live chat is not connected yet");
  if (state.canSend) $("msgInput").focus();
}

// ====================================================
// 5. Message history (REST)
// ====================================================
async function loadHistory(first) {
  const box = $("messages");
  try {
    const data = await api("/api/rooms/" + state.roomId + "/messages?page=" + state.page + "&limit=20");
    const old = box.querySelector(".older");
    if (old) old.remove();

    // API returns newest first, so reverse to show oldest at the top
    const fragment = document.createDocumentFragment();
    [...data.messages].reverse().forEach((m) => fragment.append(messageEl(m)));

    const prevHeight = box.scrollHeight;
    box.prepend(fragment);

    if (data.messages.length === data.limit) {
      const more = textEl("button", "older", "Load older messages");
      more.type = "button";
      more.onclick = () => { state.page++; loadHistory(false); };
      box.prepend(more);
    }
    if (first) {
      if (!data.messages.length) box.append(textEl("p", "placeholder", "No messages yet. Say hello."));
      box.scrollTop = box.scrollHeight;
    } else {
      box.scrollTop = box.scrollHeight - prevHeight;   // keep the view where it was
    }
  } catch (err) {
    box.append(textEl("p", "placeholder", err.message));
  }
}

function messageEl(m) {
  const mine = state.user && (m.sender_id === state.user.id || m.username === state.user.username);
  const row = document.createElement("div");
  row.className = "row" + (mine ? " mine" : "");
  if (!mine) row.append(textEl("span", "who", m.username || "Unknown"));
  row.append(textEl("div", "bubble", m.text));
  const t = document.createElement("time");
  const d = new Date(m.created_at || Date.now());
  t.dateTime = d.toISOString();
  t.textContent = d.toLocaleString([], { hour: "2-digit", minute: "2-digit", day: "numeric", month: "short" });
  row.append(t);
  return row;
}

// ====================================================
// 6. Live chat (Socket.io)
// ====================================================
function connectSocket() {
  if (typeof io === "undefined") return setStatus("History only", false);   // server has no Socket.io yet
  if (state.socket) state.socket.disconnect();

  const socket = io({ auth: { token: state.token } });
  state.socket = socket;

  socket.on("connect", () => {
    setStatus("Live", true);
    if (state.roomId) socket.emit("joinRoom", state.roomId);
    if (state.roomId) setComposer(true, "Write a message");
  });
  socket.on("disconnect", () => setStatus("Reconnecting...", false));
  socket.on("connect_error", (err) => setStatus(err.message === "xhr poll error" ? "Offline" : "Not connected", false));

  socket.on("newMessage", (m) => {
    const roomOfMsg = m.room_id ?? m.roomId;
    if (roomOfMsg !== state.roomId) return;     // message belongs to another room
    const box = $("messages");
    const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
    const empty = box.querySelector(".placeholder");
    if (empty) empty.remove();
    box.append(messageEl(m));
    if (atBottom || m.sender_id === state.user.id) box.scrollTop = box.scrollHeight;
  });
}

function setStatus(text, live) {
  state.canSend = live;
  const pill = $("status");
  pill.textContent = text;
  pill.classList.toggle("live", live);
  if (state.roomId) setComposer(live, live ? "Write a message" : "Live chat is not connected yet");
}

function setComposer(enabled, placeholder) {
  $("msgInput").disabled = !enabled;
  $("sendBtn").disabled = !enabled;
  $("msgInput").placeholder = placeholder;
}

$("composer").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = $("msgInput").value.trim();
  if (!text || !state.roomId || !state.socket) return;
  state.socket.emit("sendMessage", { roomId: state.roomId, text });
  $("msgInput").value = "";
});

// ====================================================
// 7. Mobile menu and first load
// ====================================================
$("menuBtn").onclick = () => document.body.classList.toggle("menu-open");

if (state.token && state.user) startApp();
</script>
</body>
</html>
